name: Reproducible regression or installation failure
description: Report an observed failure with commands and source provenance.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Runtime/OS, exact commands, expected and observed results. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Source and license
      description: Exact version/commit, upstream issue or fix, license, and whether this is upstream replay, minimized reconstruction, or synthetic.
  - type: textarea
    id: requirements
    attributes:
      label: Required behavior
      description: Features the repair must preserve, and declared check/helper inputs.
